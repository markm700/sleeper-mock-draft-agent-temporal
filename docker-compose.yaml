name: sleeper-mock-draft-agent

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleeper"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server
  temporal_server:
    image: temporalio/auto-setup:1.23.0
    container_name: temporal_server
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB=postgresql
      - DB_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - '7233:7233'
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z $$(hostname -i) 7233"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal UI
  temporal_ui:
    image: temporalio/ui:2.23.0
    container_name: temporal_ui
    depends_on:
      temporal_server:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_HOST}
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - '8080:8080'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Worker
  fastapi_worker:
    build:
      context: ./src
      dockerfile: Dockerfile.fastapi_worker
    container_name: fastapi_worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal_server:
        condition: service_healthy
    stdin_open: true
    tty: true
    ports:
      - '8002:8000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TEMPORAL_HOST=${TEMPORAL_HOST}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE}
    healthcheck:
      test: ["CMD","curl", "-f", "http://0.0.0.0:8000/healthz"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # Temporal Worker
  temporal_worker_service:
    build:
      context: ./src
      dockerfile: Dockerfile.temporal_worker_service
    container_name: temporal_worker_service
    depends_on:
      postgres:
        condition: service_healthy
      temporal_server:
        condition: service_healthy
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TEMPORAL_HOST=${TEMPORAL_HOST}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE}

volumes:
  postgres_data: